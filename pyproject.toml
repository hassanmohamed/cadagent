[project]
name = "cadagent"
version = "0.1.0"
description = "AI CAD Agent POC: drawing / markup / sketch to sheet-metal part, flat pattern and drawing sheet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.60",
    "cadquery>=2.5",
    "ezdxf>=1.3",
    "fastapi>=0.115",
    "pandas>=2",
    "pillow>=10",
    "pillow-heif>=0.18",
    "plotly>=5.20",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "reportlab>=4",
    "streamlit>=1.44",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
